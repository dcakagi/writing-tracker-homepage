name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the captured GitHub trending lists four times a day. GitHub
    # disables scheduled workflows on repositories with no activity for 60
    # days; re-enable it from the Actions tab if that happens.
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Inject optional analytics ID
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
        run: |
          if [ -n "$PUBLIC_GA_ID" ]; then
            sed -i "s|__PUBLIC_GA_ID__|$PUBLIC_GA_ID|g" js/app-config.js
            echo "Injected PUBLIC_GA_ID into app config."
          else
            sed -i "s|__PUBLIC_GA_ID__||g" js/app-config.js
            echo "PUBLIC_GA_ID is not set; analytics stays disabled."
          fi

          if grep -q "__PUBLIC_GA_ID__" js/app-config.js; then
            echo "Placeholder replacement failed."
            exit 1
          fi

          if grep -q 'measurementId: ""' js/app-config.js; then
            echo "Build check: measurementId is empty in artifact."
          else
            echo "Build check: measurementId was populated in artifact."
          fi

      - name: Capture GitHub trending lists
        run: python3 scripts/fetch_github_trending.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
